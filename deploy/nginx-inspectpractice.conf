# ─── InspectPractice — Nginx configuration (HTTP-first; certbot adds HTTPS) ─────

# API upstream
upstream inspectpractice_api {
    server 127.0.0.1:4013;
}

# Client upstream
upstream inspectpractice_client {
    server 127.0.0.1:3013;
}

server {
    listen 80;
    listen [::]:80;
    server_name inspectpractice.com www.inspectpractice.com;

    # ─── API ─────────────────────────────────────────────
    location /api/ {
        proxy_pass http://inspectpractice_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ─── Health check ────────────────────────────────────
    location /health {
        proxy_pass http://inspectpractice_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ─── Client ──────────────────────────────────────────
    location / {
        proxy_cache_bypass $http_upgrade;
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable, max-age=2592000";
            proxy_pass http://inspectpractice_client;
            proxy_set_header Host $host;
        }
        # HTML pages: short cache
        add_header Cache-Control "public, max-age=600, s-maxage=3600";
        proxy_pass http://inspectpractice_client;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
